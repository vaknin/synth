[workspace]
members = [
  ".",
  "crates/*",
]
resolver = "2"

[package]
edition      = "2021"
name         = "synth"
rust-version = "1.86"
version      = "0.1.0"

[[bin]]
name = "synth"
path = "./src/bin/main.rs"

[dependencies]
esp-bootloader-esp-idf = { version = "0.2.0", features = ["esp32s3"] }
esp-hal = { version = "=1.0.0-rc.1", features = [
  "esp32s3",
  "log-04",
  "unstable",
] }
log = "0.4.27"

critical-section = "1.2.0"
embassy-executor = { version = "0.9.1", features = ["log"] }
embassy-sync = { version = "0.7.2" }
embassy-time = { version = "0.4.0", features = ["log"] }
esp-backtrace = { version = "0.17.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-rtos = { version = "0.1.0", features = ["esp32s3", "embassy", "log-04"] }
esp-println = { version = "0.15.0", features = ["esp32s3", "log-04"] }
static_cell = "2.1.1"
heapless = "0.9.1"
micromath = { version = "2.1.0", default-features = false }
paste = "1.0.15"
embedded-graphics = "0.8.1"
# ASYNC FORK with split-write fix (COMMENTED OUT):
ssd1351 = { path = "crates/ssd1351-async", features = ["buffered"] }
# BLOCKING ORIGINAL (ACTIVE - testing):
# ssd1351 = { version = "0.5.0", features = ["buffered"] }
embassy-embedded-hal = "0.5.0"  # Match esp-hal's version to avoid trait conflicts
embedded-hal-bus = "0.2.0"  # For wrapping SpiBus as SpiDevice

[features]
profile = []

[profile.dev]
# Maximum performance for audio DSP
opt-level = 3
lto = false               # Disabled temporarily due to esp-hal rc.1 bitcode bug
codegen-units = 1         # Better cross-crate optimization
overflow-checks = false   # Remove runtime checks
debug-assertions = false  # Remove debug overhead
incremental = false       # Better with LTO
panic = "abort"           # Standard for no_std/embedded

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
